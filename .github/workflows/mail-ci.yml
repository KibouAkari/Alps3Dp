name: Mail delivery checks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/lib/mail*"
      - "src/lib/db.ts"
      - "src/lib/reconcile-stripe-orders.ts"
      - "src/app/api/contact/**"
      - "tests/mail-delivery.test.ts"
      - "tests/mail-flows.test.ts"
      - "tests/mail-route-integration.test.ts"
      - "src/app/api/auth/**"
      - "src/app/api/password/**"
      - "src/app/api/account/email/**"
      - "src/app/api/webhooks/payment/**"
      - "src/app/account/page.tsx"
      - "package.json"
      - "package-lock.json"
      - "docs/MAIL_SETUP.md"
      - "docs/MAIL_VERIFICATION.md"
      - "PRODUCTION_CHECKLIST.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".env.example"
      - ".github/workflows/mail-ci.yml"

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://local:local@127.0.0.1:5432/mail_ci
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://local:local@127.0.0.1:5432/mail_ci
      - run: npm run test:mail
      - name: Verify Next.js production build without external services
        run: npm run build
        env:
          DATABASE_URL: postgresql://local:local@127.0.0.1:5432/mail_ci
          NEXT_PUBLIC_APP_URL: https://www.alps3dp.ch
          APP_URL: https://www.alps3dp.ch
          NEXTAUTH_SECRET: CI_ONLY_FAKE_SECRET_DO_NOT_USE_IN_PRODUCTION_123456789
          NEXT_TELEMETRY_DISABLED: "1"
